name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Клонируем репозиторий
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Устанавливаем Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 3. Устанавливаем зависимости
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install allure-pytest

      # 4. Запускаем тесты с генерацией allure-results
      - name: Run tests
        run: |
          mkdir -p allure-results
          pytest --alluredir=allure-results

      # 5. Устанавливаем Allure
      - name: Install Allure
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.zip
          unzip allure-2.27.0.zip -d $HOME/allure
          echo "$HOME/allure/allure-2.27.0/bin" >> $GITHUB_PATH

      # 6. Генерируем Allure HTML отчет
      - name: Generate Allure Report
        run: |
          allure generate allure-results --clean -o allure-report

      # 7. Загружаем отчет как артефакт
      - name: Upload Allure Report Artifact
        uses: actions/upload-artifact@v3
        with:
          name: allure-report
          path: allure-report

      # 8. Публикуем отчет на GitHub Pages
      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          publish_branch: gh-pages
          allow_empty_commit: true
          force_orphan: true
